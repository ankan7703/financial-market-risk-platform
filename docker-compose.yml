
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: financial-risk-api
    ports:
      - "8000:8000"

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "8501:8501"
    environment:
      API_URL: "http://api:8000"
    depends_on:
      - api
